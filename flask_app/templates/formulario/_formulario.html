{% extends "formulario/base.html" %}

{% block title %}Crear aviso{% endblock %}

{% block content %}
<div class="main-container">
    <h1>Crea tu aviso de adopción!</h1>

    {% if mensaje %}
        <div id="val-box">
            <h2>{{ mensaje }}</h2>
        </div>
    {% endif %}

    <form method="post" enctype="multipart/form-data">
        <div class="donde">
            <h2>Dónde?</h2>

            <label for="comuna">Comuna</label>
            <input type="text" name="comuna" id="comuna" maxlength="255" required><br>

            <label for="sector">Sector</label>
            <input type="text" name="sector" id="sector" maxlength="255"><br><br>
        </div>

        <div class="contacto">
            <h2>Información de contacto</h2>

            <label for="nombre">Nombre</label>
            <input type="text" name="nombre" id="nombre" required><br>

            <label for="email">Email</label>
            <input type="email" name="email" id="email" required><br>

            <label for="celular">Teléfono</label>
            <input type="tel" name="celular" id="celular"><br>
        </div>

        <div class="mascota">
            <h2>Información de la(s) mascota(s)</h2>

            <label for="tipo">Tipo de Mascota</label>
            <select name="tipo" id="tipo" required>
                <option value="">Seleccione</option>
                <option value="Perro">Perro</option>
                <option value="Gato">Gato</option>
                <option value="Otro">Otro</option>
            </select><br>

            <label for="cantidad">Cantidad</label>
            <input type="number" name="cantidad" id="cantidad" min="1" required><br>

            <label for="edad">Edad</label>
            <input type="number" name="edad" id="edad" min="0" required><br>

            <label for="unidad_medida">Unidad de medida</label>
            <select name="unidad_medida" id="unidad_medida" required>
                <option value="">Seleccione</option>
                <option value="meses">Meses</option>
                <option value="años">Años</option>
            </select><br>

            <label for="fecha_entrega">Disponibilidad para entrega</label>
            <input type="datetime-local" name="fecha_entrega" id="fecha_entrega" required><br>

            <label for="descripcion">Descripción</label>
            <textarea name="descripcion" id="descripcion" rows="6" cols="50"></textarea><br>

            <label for="foto">Foto</label>
            <input type="file" name="foto" id="foto" accept="image/*"><br>
        </div>

        <button type="submit" id="submit-btn">Agregar aviso de adopción</button>
    </form>
</div>
{% endblock %}
